[ClassicAxis]
; Native re3 integration: enabled only with Standard Controls.
; Free Cam continues to control free orbit independently.

; Optional mouse lock-on. Controller lock-on is enabled independently.
ForceAutoAim = false

; Hold to walk. Case-insensitive: A-Z, 0-9, SPACE, TAB, CAPSLOCK, ENTER,
; BACKSPACE, LALT/RALT/ALT, LSHIFT/RSHIFT/SHIFT, LCTRL/RCTRL/CTRL.
; NULL disables it. Unknown names fall back to LALT. Restart after editing.
WalkKey = LALT
; Single uppercase letter or NULL to disable. Sprint/jump/enter vehicle stand up.
CrouchKey = NULL

ModernCamera = true
ZoomForAssaultRifles = true
StoriesAimingCoords = false
StoriesPointingArm = false
; The crosshair is always centred. Old CameraCrosshairMultX/Y values are ignored.

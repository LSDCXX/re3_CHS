[MENUMAP]
; 大地图渲染颜色 (RGBA)
RadarMapColor = 255 255 255 255
BackgroundColor = 0 0 0 255
CrosshairColor = 234 171 54 155
ZoneNameColor = 255 255 255 255

; 强制常驻显示所有服务点 Blip（武装国度、喷漆店、炸弹店、藏身处）
ForceBlipsOnMap = true

; SkyUI 兼容开关（如果检测到 SkyUI 会自动启用）
SkyUI = false

; 启用图例框
EnableLegendBox = true

; 设为 false，直接使用 MenuNew 内部内置的精准中文映射与悬停提示
ReadStringsFromThisFile = false

[BLIPS]
